apiVersion: v1
kind: ConfigMap
metadata:
  name: mini-imdb-config
  namespace: mini-imdb
data:
  PORT: "8080"
  HOST: "0.0.0.0"
  APP_VERSION: "2.2.0"
  DB_HOST: "mariadb.data.svc.cluster.local"
  DB_PORT: "3306"
  DB_CONNECTION_LIMIT: "10"
  MONGO_HOST: "mongodb.data.svc.cluster.local"
  MONGO_PORT: "27017"
  MONGO_AUTH_SOURCE: "admin"
  REDIS_HOST: "redis.data.svc.cluster.local"
  REDIS_PORT: "6379"
  CACHE_TTL_SECONDS: "60"
  API_UPSTREAM: "http://api.mini-imdb.svc.cluster.local:8080"
  CATALOG_SQL_PATH: "/sql/catalog.sql"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm.observability.svc.cluster.local:4318"
