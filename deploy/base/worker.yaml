apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mini-imdb
  labels:
    app: worker
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        tier: application
    spec:
      serviceAccountName: mini-imdb-app-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/dangwii/mini-imdb-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: health
          envFrom:
            - configMapRef:
                name: mini-imdb-config
            - secretRef:
                name: mini-imdb-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "mini-imdb-worker"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 350m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: mini-imdb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
