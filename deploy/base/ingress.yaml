apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mini-imdb-ingress
  namespace: mini-imdb
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: mini-imdb-api-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
