apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: security
  labels:
    app: wazuh-manager
spec:
  ports:
    - name: registration
      port: 1515
      targetPort: 1515
    - name: events
      port: 1514
      targetPort: 1514
    - name: api
      port: 55000
      targetPort: 55000
  selector:
    app: wazuh-manager
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: security
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.9.2
          ports:
            - containerPort: 1514
              name: events
            - containerPort: 1515
              name: registration
            - containerPort: 55000
              name: api
          env:
            - name: INDEXER_URL
              value: "https://wazuh-indexer.security.svc.cluster.local:9200"
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: "none"
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 800m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 1514
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1514
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: wazuh-manager-data
              mountPath: /var/ossec/data
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
