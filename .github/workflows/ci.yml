name: CI - Lint, Build, Scan & Manifest Validation

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-checks:
    name: Syntax & Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check API syntax
        run: |
          node --check application/index.js
          node --check application/init-db.js

      - name: Check Worker syntax
        run: node --check worker/index.js

      - name: Check Python test scripts
        run: python3 -m py_compile scripts/load_test.py scripts/failover_test.py scripts/chaos_monkey.py

  kubernetes-manifests:
    name: Validate Kustomize & Kubernetes Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform & kustomize
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          curl -sSL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate manifests with kubeconform
        run: |
          for path in deploy/platform/data deploy/platform/rabbitmq deploy/overlays/dev deploy/overlays/prod; do
            echo "=== Validating $path ==="
            kustomize build "$path" | kubeconform -summary -strict -ignore-missing-schemas
          done

  build-and-scan:
    name: Build & Trivy Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./application
          - service: web
            context: ./web
          - service: worker
            context: ./worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local load for scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: mini-imdb-${{ matrix.service }}:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mini-imdb-${{ matrix.service }}:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
