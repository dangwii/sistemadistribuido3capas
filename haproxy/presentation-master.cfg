global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option redispatch
    retries 3
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend presentation
    bind *:80
    http-request set-header X-Presentation-LB presentation-lb-master
    default_backend websites

backend websites
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server web1 web1:80 check inter 1s fall 2 rise 2
    server web2 web2:80 check inter 1s fall 2 rise 2
    server web3 web3:80 check inter 1s fall 2 rise 2
