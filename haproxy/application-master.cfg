global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option redispatch
    retries 3
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend application
    bind *:8080
    http-request set-header X-Application-LB application-lb-master
    default_backend application_nodes

backend application_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server app1 app1:8080 check inter 1s fall 2 rise 2
    server app2 app2:8080 check inter 1s fall 2 rise 2
    server app3 app3:8080 check inter 1s fall 2 rise 2
