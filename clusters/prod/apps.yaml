apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-data
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./deploy/platform/data
  prune: true
  sourceRef:
    kind: GitRepository
    name: mini-imdb
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-rabbitmq
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-data
  interval: 5m0s
  path: ./deploy/platform/rabbitmq
  prune: true
  sourceRef:
    kind: GitRepository
    name: mini-imdb
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mini-imdb-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-data
    - name: platform-rabbitmq
  interval: 2m0s
  path: ./deploy/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: mini-imdb
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 3m0s
