apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mini-imdb-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-data
    - name: platform-rabbitmq
  interval: 1m0s
  path: ./deploy/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: mini-imdb
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      namespace: mini-imdb
    - apiVersion: apps/v1
      kind: Deployment
      name: api
      namespace: mini-imdb
    - apiVersion: apps/v1
      kind: Deployment
      name: worker
      namespace: mini-imdb
  timeout: 2m0s
