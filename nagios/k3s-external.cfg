# Nagios external black-box monitoring for Mini-IMDb on K3s Ingress
# Keeps Nagios outside the cluster to verify end-to-end external availability
# without duplicating in-cluster metrics handled by OpenTelemetry + Grafana LGTM.

define host {
    use                     linux-server
    host_name               k3s-mini-imdb-ingress
    alias                   Mini-IMDb K3s Public Ingress
    address                 host.docker.internal
    max_check_attempts      3
    check_interval          1
}

define service {
    use                     generic-service
    host_name               k3s-mini-imdb-ingress
    service_description     HTTP Portal Root (/)
    check_command           check_http!-p 80 -u / -s "Mini-IMDb"
}

define service {
    use                     generic-service
    host_name               k3s-mini-imdb-ingress
    service_description     API Liveness (/api/healthz)
    check_command           check_http!-p 80 -u /api/healthz -s "alive"
}

define service {
    use                     generic-service
    host_name               k3s-mini-imdb-ingress
    service_description     API Readiness (/api/readyz)
    check_command           check_http!-p 80 -u /api/readyz -s "ok"
}
